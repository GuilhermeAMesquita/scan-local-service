name: Build Windows scanner connector

on:
  push:
    branches:
      - main
      - fix/scan-quality-300dpi-20261026
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ScanLocalService.sln --configuration Release
      - name: Publish self-contained executable
        run: dotnet publish ScanLocalService.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish_single
      - name: Smoke test local HTTP service
        shell: pwsh
        run: |
          $service = Start-Process -FilePath "$PWD\publish_single\ScanLocalService.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.version -eq '1.0.10.0') {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) { throw 'O conector não respondeu em /health.' }
            $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/api/dashboard/status'
            if ($status.version -ne '1.0.10.0') { throw 'Status do painel incorreto.' }
            if ($status.startup.configured) { throw 'Inicialização automática inesperadamente ativada.' }
            $startupUrl = 'http://127.0.0.1:4545/api/dashboard/startup'
            try {
              Invoke-RestMethod -Uri $startupUrl -Method Post -ContentType 'application/json' -Body '{"enabled":true}' -ErrorAction Stop | Out-Null
              throw 'Endpoint aceitou alteração sem cabeçalho do painel.'
            } catch {
              if ($_.Exception.Response.StatusCode -ne 403) { throw }
            }
            try {
              $startup = Invoke-RestMethod -Uri $startupUrl -Method Post -ContentType 'application/json' -Headers @{'X-Scanner-Dashboard'='1'} -Body '{"enabled":true}'
              if (-not $startup.configured -or -not $startup.pointsToCurrentExe) { throw 'Inicialização automática não ativada.' }
              $status = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/api/dashboard/status'
              if (-not $status.startup.pointsToCurrentExe) { throw 'Status não refletiu a configuração.' }
            } finally {
              $startup = Invoke-RestMethod -Uri $startupUrl -Method Post -ContentType 'application/json' -Headers @{'X-Scanner-Dashboard'='1'} -Body '{"enabled":false}'
              if ($startup.configured) { throw 'Inicialização automática não desativada.' }
            }
            $devices = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/api/dashboard/devices'
            if ($null -eq $devices.available) { throw 'Resposta de dispositivos inválida.' }
            $logs = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/api/dashboard/logs'
            if ($null -eq $logs.lines) { throw 'Resposta de logs inválida.' }
            foreach ($page in @('status', 'devices', 'logs')) {
              $html = Invoke-WebRequest -Uri "http://127.0.0.1:4545/ui/$page"
              if ($html.StatusCode -ne 200 -or $html.Content -notmatch 'Regulariza Farma') {
                throw "Página $page inválida."
              }
            }
            foreach ($asset in @('app.css', 'app.js')) {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:4545/ui/$asset"
              if ($response.StatusCode -ne 200) { throw "Asset $asset indisponível." }
            }
          } finally {
            Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: scan-local-service-1.0.10-win-x64
          path: |
            publish_single/ScanLocalService.exe
            publish_single/LatoFont/**
