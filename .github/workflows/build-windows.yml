name: Build Windows scanner connector

on:
  push:
    branches:
      - main
      - fix/scan-quality-300dpi-20261026
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build ScanLocalService.sln --configuration Release
      - name: Publish self-contained executable
        run: dotnet publish ScanLocalService.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish_single
      - name: Smoke test local HTTP service
        shell: pwsh
        run: |
          $service = Start-Process -FilePath "$PWD\publish_single\ScanLocalService.exe" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:4545/health' -TimeoutSec 2
                if ($health.status -eq 'ok' -and $health.version -eq '1.0.8.0') {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (-not $ready) { throw 'O conector não respondeu em /health.' }
          } finally {
            Stop-Process -Id $service.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: scan-local-service-win-x64
          path: |
            publish_single/ScanLocalService.exe
            publish_single/LatoFont/**
